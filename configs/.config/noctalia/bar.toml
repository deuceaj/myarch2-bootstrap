# Noctalia bar — Mac-style menu bar: thin, full width, near-opaque graphite.
# The previous "island" layout is saved in layouts/bar-island.toml
# (copy it over this file to switch back).
# https://docs.noctalia.dev/noctalia/bar/

[bar]
order = ["default"]

[bar.default]
position             = "top"
thickness            = 30
margin_ends          = 0       # full width
margin_edge          = 0
concave_edge_corners = false
radius               = 0
background_opacity   = 0.96    # nearly solid dark grey, like Glimpse/macOS
compositor_blur      = true
shadow               = false
border_width         = 0.0
capsule              = false
padding              = 12
widget_spacing       = 12
font_weight          = 500

start  = ["launcher", "workspaces", "active_window"]
center = ["weather", "clock", "notifications", "divider", "spotify", "audio_visualizer"]   # Glimpse-style centered date/time
end    = ["remmina", "localsend", "tailnet", "mullvad", "displays", "lock_keys", "tray", "bluetooth", "volume", "notes"]

# Portrait monitor (HDMI-A-1, 1080 px wide): workspaces, system stats, and
# pending Arch updates + Claude usage on the right.
[bar.default.monitor.portrait]
match  = "HDMI-A-1"
start  = ["workspaces"]
center = ["gpu", "temp", "ram", "network_rx"]
end    = ["arch_updates", "claude_usage"]

# ─── Widgets ───────────────────────────────────────────────────────────────

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

# Portrait bar stats: readouts stay on the bar, but clicking any of them opens
# the nvtop panel instead of each widget's own dropdown.
[widget.temp]
type = "sysmon"
stat = "cpu_temp"
[widget.temp.actions]
left = "panel-toggle tordex/nvtop:panel"

[widget.ram]
type = "sysmon"
stat = "ram_used"
[widget.ram.actions]
left = "panel-toggle tordex/nvtop:panel mem"

[widget.network_rx]
type = "sysmon"
stat = "net_rx"
[widget.network_rx.actions]
left = "panel-toggle tordex/nvtop:panel"

[widget.control-center]
glyph = "navigation"

# "|" separator between the notification bell and the Spotify widget.
[widget.divider]
type = "text"
text = "|"

# Spotify now playing: art, scrolling track, prev/play/next
# (azokyen/spotify-media). Built for Hyprland: the controls work through
# playerctl, but clicking the art (focus/launch Spotify) does nothing here.
[widget.spotify]
type = "azokyen/spotify-media:bar"

[widget.notes]
type = "noctalia/notes:notes"

[widget.weather]
show_condition   = false
show_temperature = true

# Glimpse-style workspace dots: small dots for other workspaces; the current
# one is a slightly longer pill showing its number. Monochrome so it never
# follows the wallpaper.
[widget.workspaces]
style              = "focus_hint"
show_labels        = true    # focus_hint labels only the current workspace
show_icons         = false
label_source       = "name"  # 1-6 / 7-0
active_pill_size   = 2.2
focused_color      = "secondary"   # light grey pill + dark number (MacDark secondary is neutral)
occupied_color     = "on_surface_variant"
empty_color        = "surface_container_highest"
urgent_color       = "error"

[widget.clock]
format         = "{:%a %b %-d  %-I:%M %p}"
tooltip_format = "{:%A, %B %d, %Y}"

# Claude plan usage (felipeartur/ai-usagebar plugin; needs the ai-usagebar CLI).
[widget.claude_usage]
type          = "felipeartur/ai-usagebar:bar"
vendor        = "anthropic"
visualization = "gauge"
extras        = "both"

# GPU load as a plain readout matching the others; click opens the nvtop
# panel (tordex/nvtop plugin must stay enabled; its graphs need python-pillow).
[widget.gpu]
type = "sysmon"
stat = "gpu_usage"
[widget.gpu.actions]
left = "panel-toggle tordex/nvtop:panel gpu"

# Pending pacman/AUR/flatpak updates (yuuto/arch-updater plugin); click for
# the update panel. Also /arch in the launcher.
[widget.arch_updates]
type = "yuuto/arch-updater:widget"

# LocalSend (mera/localsend): AirDrop-style sharing with the phone's LocalSend
# app over Wi-Fi. Click for nearby devices; incoming files land in
# ~/Downloads/LocalSend. Needs ufw to allow 53317 tcp+udp.
[widget.localsend]
type = "mera/localsend:widget"

# Remmina connections (rylos/remmina plugin): click for a list of saved
# Remmina profiles; also /rmn in the launcher.
[widget.remmina]
type = "rylos/remmina:bar"

# Tray: hide the Mullvad app's icon; the Mullvad bar plugin below controls
# the VPN instead (via the CLI, so the Mullvad app doesn't need to run).
# Find IDs: busctl --user get-property org.kde.StatusNotifierWatcher
#   /StatusNotifierWatcher org.kde.StatusNotifierWatcher RegisteredStatusNotifierItems
[widget.tray]
hidden = ["Mullvad VPN_status_icon_1"]

# Tailscale (rylos/tailnet, replaces Trayscale): online hosts with one-click
# IP/name copy, connect/disconnect, exit nodes, Taildrop. Launcher: /ts-style
# host search. Operator is already "deuce", so no sudo needed.
[widget.tailnet]
type = "rylos/tailnet:bar"

# Mullvad VPN (3dprogramin/mullvad): connect by country, lockdown, multihop.
[widget.mullvad]
type = "3dprogramin/mullvad:status"

# Plugin widgets defined but not placed on a bar yet; add a name to a
# start/center/end list to show it.
[widget.umbriel_companion]
type = "noctalia/umbriel-companion:bar"

[widget.xwayland]
type = "tordex/xwayland:bar"

# Monitors (prponkshe/umbriel-displays): click for resolution, refresh,
# scale, rotation and arrangement. Settings: displays.toml.
[widget.displays]
type = "prponkshe/umbriel-displays:bar"
