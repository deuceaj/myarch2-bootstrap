# Noctalia desktop widgets on the portrait Dell (HDMI-A-1, 1080x1920 logical).
# Moved off the ultrawide 2026-11-23.
# Fine-tune positions with `noctalia msg desktop-widgets-edit` (drag, then
# Done); the editor saves its changes to ~/.local/state/noctalia/settings.toml.
# https://docs.noctalia.dev/noctalia/desktop/widgets/

[desktop_widgets]
enabled        = true
schema_version = 2
widget_order   = ["audio_bars", "clock_main", "clock_date"]

# Day name ("MONDAY") in Anurati, mostly-opaque white, no card behind it.
# Centered left-to-right, 15% down from the top (1920 * 0.15 = 288).
# The text scales with the box: 512x132 is twice the 256x66 auto-fit size.
[desktop_widgets.widget.clock_main]
type       = "clock"
output     = "HDMI-A-1"
cx         = 540.0
cy         = 288.0
box_width  = 760.0
box_height = 150.0
[desktop_widgets.widget.clock_main.settings]
clock_style = "digital"
font_family = "Anurati"   # wide sci-fi caps (from the Rainmeter Mond skin); ~/.local/share/fonts
format      = "{:%A}"     # day name; Anurati draws it in caps
color       = "#ffffffe6"   # white, 90% opacity (e6 = 230/255)
center_text = true
background  = false
shadow      = false  # a solid shadow under the text blocks the wallpaper

# Date line under the day name, Mond-style (Quicksand). 110 px below the day.
[desktop_widgets.widget.clock_date]
type       = "clock"
output     = "HDMI-A-1"
cx         = 540.0
cy         = 400.0
box_width  = 420.0
box_height = 48.0
[desktop_widgets.widget.clock_date.settings]
clock_style = "digital"
font_family = "Quicksand"
format      = "{:%-d %B, %Y}"
color       = "#ffffffcc"
center_text = true
background  = false
shadow      = false

# Spectrum bars along the bottom: 80% of the screen width (864 px),
# 115 px tall, centered, same bottom margin as before.
[desktop_widgets.widget.audio_bars]
type       = "audio_visualizer"
output     = "HDMI-A-1"
cx         = 540.0
cy         = 1862.0
box_width  = 864.0
box_height = 115.0
[desktop_widgets.widget.audio_bars.settings]
bands          = 48   # was 96; halves the redraw work on the integrated GPU
mirrored       = true
centered       = false
show_when_idle = false
color_1        = "primary"
color_2        = "secondary"
background     = false
