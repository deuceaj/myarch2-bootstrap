# Umbriel — Keybinds
# Included from ../config.toml

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications
"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod+Space" = { action = "spawn vicinae toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Q" = { action = "window-kill", repeat = false }

# Session (ported from niri)
"Mod+Alt+L" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+X" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }
# Pass Mod combos through to the focused app (VMs, remote desktops); press again to restore.
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Applications (ported from niri)
"Mod+B" = { action = "spawn firefox", repeat = false }
"Mod+C" = { action = "spawn code", repeat = false }
"Mod+E" = { action = "spawn thunar", repeat = false }
"Mod+O" = { action = "spawn obsidian", repeat = false }
"Mod+V" = { action = "spawn pavucontrol", repeat = false }
"Ctrl+Alt+Space" = { action = "spawn claude-desktop --password-store=basic", repeat = false }

# Remote desktops: Remmina profiles, fullscreen on the current workspace
"Mod+Ctrl+1" = { action = "spawn /home/deuce/.config/umbriel/scripts/remmina-here.py group_rdp_claudius_192-168-2-49.remmina", repeat = false }
"Mod+Ctrl+2" = { action = "spawn /home/deuce/.config/umbriel/scripts/remmina-here.py group_rdp_work_100-92-56-29.remmina", repeat = false }
"Mod+Ctrl+3" = { action = "spawn /home/deuce/.config/umbriel/scripts/remmina-here.py group_rdp_kodus_192-168-2-3.remmina", repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up 3", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down 3", allow_when_locked = true }
# Ctrl + volume knob: the active player's own volume (Spotify, browser) by 3%
"Ctrl+XF86AudioRaiseVolume" = { action = "spawn noctalia msg media volume-up 3", allow_when_locked = true }
"Ctrl+XF86AudioLowerVolume" = { action = "spawn noctalia msg media volume-down 3", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus (ported from niri)
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"

# Move within workspace
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

# Move to other monitor
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"

# Resize: deltas are fractions of the output (0.1 = 10%)
"Mod+Ctrl+Left" = "window-modify-width-right -0.1"
"Mod+Ctrl+Right" = "window-modify-width-right 0.1"
"Mod+Ctrl+Up" = "window-modify-height-down -0.1"
"Mod+Ctrl+Down" = "window-modify-height-down 0.1"
"Mod+Minus" = "window-modify-width-right -0.1"
"Mod+Equal" = "window-modify-width-right 0.1"
"Mod+Shift+Minus" = "window-modify-height-down -0.1"
"Mod+Shift+Equal" = "window-modify-height-down 0.1"
"Mod+Shift+C" = "column-center"

# Window state
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+A" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+O" = { action = "overview-toggle", repeat = false }

# Panels (noctalia + plugins)
"Mod+M" = { action = "spawn noctalia msg panel-toggle tordex/processes:panel", repeat = false }
"Ctrl+Alt+Delete" = { action = "spawn noctalia msg panel-toggle tordex/processes:panel", repeat = false }
"Mod+W" = { action = "spawn noctalia msg plugin yngwe/wallpaperCarousel:service all toggle", repeat = false }
"Mod+N" = { action = "spawn noctalia msg panel-toggle control-center notifications", repeat = false }
"Mod+Shift+N" = { action = "spawn noctalia msg panel-toggle noctalia/notes:panel", repeat = false }
"Mod+Shift+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+D" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+D" = { action = "spawn noctalia msg bar-toggle", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }

# Window switcher (noctalia): hold Alt, tap Tab to cycle
"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"

# Screenshots (noctalia)
"Mod+P" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Ctrl+P" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Mod+Alt+P" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Mod+Shift+P" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }

# Workspaces: 1-6 on DP-1, 7-0 on HDMI-A-1 (see outputs.toml).
# --name selects by name, so Mod+7 jumps to the portrait monitor's "7".
# Move the whole workspace, retaining its name, layout, and windows.
# "Mod+Ctrl+Page_Down" = "workspace-move-to-output-next"
# "Mod+Ctrl+Page_Up" = "workspace-move-to-output-previous"
"Mod+1" = "workspace-switch --name 1"
"Mod+2" = "workspace-switch --name 2"
"Mod+3" = "workspace-switch --name 3"
"Mod+4" = "workspace-switch --name 4"
"Mod+5" = "workspace-switch --name 5"
"Mod+6" = "workspace-switch --name 6"
"Mod+7" = "workspace-switch --name 7"
"Mod+8" = "workspace-switch --name 8"
"Mod+9" = "workspace-switch --name 9"
"Mod+0" = "workspace-switch --name 0"
"Mod+Shift+1" = "window-move-to-workspace --name 1"
"Mod+Shift+2" = "window-move-to-workspace --name 2"
"Mod+Shift+3" = "window-move-to-workspace --name 3"
"Mod+Shift+4" = "window-move-to-workspace --name 4"
"Mod+Shift+5" = "window-move-to-workspace --name 5"
"Mod+Shift+6" = "window-move-to-workspace --name 6"
"Mod+Shift+7" = "window-move-to-workspace --name 7"
"Mod+Shift+8" = "window-move-to-workspace --name 8"
"Mod+Shift+9" = "window-move-to-workspace --name 9"
"Mod+Shift+0" = "window-move-to-workspace --name 0"

# Scratchpad
"Mod+Shift+S" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+S" = "scratchpad-toggle"
"Mod+Ctrl+S" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"
