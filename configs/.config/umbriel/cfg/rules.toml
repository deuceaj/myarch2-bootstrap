# ==============================================================================
# Layer rules
# https://docs.noctalia.dev/umbriel/layer-rules/
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"  # desktop widgets excluded so the clock text stays see-through
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Panels, the dock, notifications and OSDs open over windows, so they blur the
# live content behind them. The bar and desktop widgets sit on the wallpaper and
# keep the cached wallpaper blur.
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
# Spotify opens on workspace 11 (left Dell) at login, without taking focus.
# (cava + LACT GUI no longer autostart; the LACT daemon still runs the fans.)
[[window_rule]]
match.app_id = "^Spotify$"
default_workspace = "11"
default_focused = false

# ==============================================================================
# Named scratchpads. Defining any removes umbriel's implicit default, so the
# everyday Mod+S scratchpad is named "general".
[[scratchpad]]
name = "general"

# Google Messages for web as an app window (no browser UI), dropped down with
# Mod+G. The first toggle launches it; texts arrive as noctalia notifications.
[[scratchpad]]
name = "messages"
spawn_when_empty = "chromium --app=https://messages.google.com/web"
hide_when_empty = true

[[window_rule]]
match.app_id = "^chrome-messages[.]google[.]com__web-Default$"
default_scratchpad = "messages"
# Drop-down under the right end of the noctalia bar: 1/5 screen wide.
default_floating_size = { width = 0.2, height = 0.75 }
default_position = { x = 8, y = 8, anchor = "top_right" }
