# Umbriel — Window rules, layer rules & scratchpads
# Included from ../config.toml

# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/

# Blur windows over the cached wallpaper blur. Set blur_optimized = false to
# include overlapping windows behind them, at a GPU cost on every frame that
# moves anything behind them.
[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Ported from niri cfg/rules.kdl

# Translucent apps (blur is already on for every window above)
[[window_rule]]
match.app_id = ["^com[.]microsoft[.]VSCode$", "^code$", "^thunar$", "^Thunar$", "^kitty$"]
opacity = 0.75

[[window_rule]]
match.app_id = ["^com[.]anthropic[.]Claude$", "^md[.]obsidian[.]Obsidian$", "^obsidian$"]
opacity = 0.75

# Steam: every window floats except the main client window
[[window_rule]]
match.app_id = "^steam$"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^[Ss]team$"
default_floating = false

# File open/save/upload dialogs: centered floating popup
[[window_rule]]
match.app_id = "^xdg-desktop-portal-(gnome|gtk|kde)$"
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }

[[window_rule]]
match.title = [
  "^(Open|Save|Choose|Select|Export|Import)( a| an)?( Files?| Folders?| Images?| Documents?| As| Location| Directory)?( …|[.][.][.])?$",
  "^File Upload$",
]
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }

# Sports dashboard (Chrome web app): fullscreen on workspace 9 (portrait)
[[window_rule]]
match.app_id = "^chrome-100[.]108[.]111[.]110__-Default$"
default_workspace = "9"
default_fullscreen = true

# Keep game menus inside their window; a focus or workspace keybind releases
# the pointer (e.g. Mod+7..0 jumps to the portrait monitor for a game guide).
[[window_rule]]
match.app_id = "^steam_app_.*$"
confine_pointer = true
# Games (Wine/Proton) ask to swallow all keys; refuse so Mod+ shortcuts
# (workspace keys, Mod+Shift+Escape release) always work in games.
allow_shortcuts_inhibit = false

